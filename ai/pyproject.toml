[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wherugo-ai"
version = "0.1.0"
description = "WherUGo provider-agnostic LLM/VLM layer: Turkish daily briefing, analytics assistant, VLM clip-judge stub. No required dependencies (stdlib HTTP)."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Official SDKs are OPTIONAL; core providers use stdlib urllib only.
providers = ["anthropic>=0.40", "openai>=1.40"]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["wherugo_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
