# WherUGo demo kenar config'i (CONTRACTS §6): 20x12 m moda mağazası, ~8 zone.
# Plan koordinatları metre; (0,0) sol-alt köşe, +y kuzey (mağaza içi).

tenant_id: t_demo
store_id: 1
device_id: edge-1a
backend_url: "http://localhost:8000"
auth_token: demo

store:
  name: "WherUGo Demo Moda Magazasi"
  plan_width_m: 20.0
  plan_height_m: 12.0
  timezone: "Europe/Istanbul"

cameras:
  # Örnek piksel->plan homografisi (1920x1080 -> 20x12 m; simulate modda kullanılmaz)
  - id: 1
    name: cam-giris
    homography:
      - [0.0104167, 0.0, 0.0]
      - [0.0, -0.0111111, 12.0]
      - [0.0, 0.0, 1.0]

zones:
  - id: 1
    name: "Giris"
    zone_type: entrance
    polygon: [[8, 0], [12, 0], [12, 2], [8, 2]]
  - id: 2
    name: "Kadin Ust Giyim"
    zone_type: shelf
    category: "kadin-ust"
    polygon: [[1, 3], [6, 3], [6, 7], [1, 7]]
  - id: 3
    name: "Erkek Ust Giyim"
    zone_type: shelf
    category: "erkek-ust"
    polygon: [[14, 3], [19, 3], [19, 7], [14, 7]]
  - id: 4
    name: "Aksesuar"
    zone_type: shelf
    category: "aksesuar"
    polygon: [[7.5, 3.5], [12.5, 3.5], [12.5, 8], [7.5, 8]]
  - id: 5
    name: "Ayakkabi"
    zone_type: shelf
    category: "ayakkabi"
    polygon: [[1, 8], [6, 8], [6, 11.5], [1, 11.5]]
  - id: 6
    name: "Deneme Kabini Onu"
    zone_type: fitting_room
    polygon: [[14, 8], [17, 8], [17, 11.5], [14, 11.5]]
  - id: 7
    name: "Kasa Kuyrugu"
    zone_type: queue
    polygon: [[7, 9], [12, 9], [12, 10.5], [7, 10.5]]
  - id: 8
    name: "Kasa"
    zone_type: checkout
    polygon: [[7, 10.5], [12, 10.5], [12, 12], [7, 12]]

zone_engine:
  hysteresis_samples: 2      # enter/exit için ardışık örnek sayısı
  dwell_threshold_sec: 5.0   # zone_exit.classification: dwell | pass_by
  interaction_dwell_sec: 8.0 # shelf'te interaction_candidate eşiği
  queue_interval_sec: 30     # queue_measurement periyodu
  service_time_sec: 60       # est_wait_sec tahmini için kişi başı servis süresi

simulation:
  staff_ratio: 0.1
  staff_max_concurrent: 2    # aynı anda mağazadaki personel tavanı
  staff_shift_sec: 2400      # personel vardiya süresi (sim sn)
  arrivals_per_hour: 120
  hourly_curve: [0.30, 0.30, 0.30, 0.30, 0.30, 0.35, 0.40, 0.50, 0.60, 0.75, 0.90, 1.00,
                 1.00, 0.95, 0.85, 0.80, 0.85, 0.95, 1.00, 0.90, 0.70, 0.55, 0.45, 0.35]
  walk_speed_mps: [0.9, 1.5]
  buy_probability: 0.40
  fitting_room_probability: 0.25
  pass_by_probability: 0.30
  checkout_count: 2
  service_time_sec: 120      # kasada kişi başı servis süresi (lognormal medyanı)

publisher:
  spool_path: "wherugo-edge-spool.sqlite"
  batch_size: 200
  flush_interval_sec: 2.0
